<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" role="img" aria-labelledby="title desc">
  <title id="title">AI Career Path</title>
  <desc id="desc">AI Career Path logo with a human head, neural brain, upward career arrows, and the subtitle Powered by Behaviour Analysis.</desc>
  <defs>
    <linearGradient id="tealHead" x1="275" y1="132" x2="446" y2="355" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11c9a4"/>
      <stop offset="0.45" stop-color="#04879a"/>
      <stop offset="1" stop-color="#053b65"/>
    </linearGradient>
    <linearGradient id="pathTeal" x1="310" y1="410" x2="560" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#057b70"/>
      <stop offset="1" stop-color="#16d0b0"/>
    </linearGradient>
    <linearGradient id="pathBlue" x1="405" y1="430" x2="650" y2="145" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0667a9"/>
      <stop offset="1" stop-color="#26a9e0"/>
    </linearGradient>
    <linearGradient id="pathGreen" x1="520" y1="432" x2="790" y2="235" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18833c"/>
      <stop offset="1" stop-color="#7cc943"/>
    </linearGradient>
    <linearGradient id="personGrad" x1="435" y1="322" x2="515" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0aa28d"/>
      <stop offset="1" stop-color="#044a76"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.04 0 0 0 0 0.78 0 0 0 0 0.66 0 0 0 0.55 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b4160" flood-opacity="0.18"/>
    </filter>
  </defs>
  <g transform="translate(0 -12)" filter="url(#shadow)">
    <path d="M329 404 C375 312 445 238 553 192 L582 246 C501 286 440 350 402 426 Z" fill="url(#pathTeal)"/>
    <path d="M441 427 C489 319 558 232 653 150 L672 204 C596 268 544 345 514 427 Z" fill="url(#pathBlue)"/>
    <path d="M575 426 C628 328 695 272 781 232 L795 291 C725 327 678 374 646 426 Z" fill="url(#pathGreen)"/>

